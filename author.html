<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Author Profile | The Finshift Order</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/author.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

<div class="page">
  <div class="author-profile-container">
    <a href="index.html" class="back-btn">← Back to Financial Digest</a>

    <div class="author-hero-header">
      <img id="avatar" class="author-hero-avatar" alt="Author Avatar">
      <div class="author-hero-info">
        <h1 id="name" class="author-hero-name">Author Name</h1>
        <div id="role" class="author-hero-role">Financial Analyst</div>
        <div id="bio" class="author-hero-bio">Bio details loading...</div>
        <div class="author-stats-row">
          <span id="articlesCountStat" class="stat-pill">Published Articles: 0</span>
          <span id="totalViewsStat" class="stat-pill">Total Reads: 0</span>
        </div>
      </div>
    </div>

    <h2 class="author-articles-section-title">Published Articles & Market Reports</h2>
    <div id="authorStories" class="author-stories-list"></div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
